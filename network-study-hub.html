written:[
["Describe the 4 addressing methods and the layer each belongs to. [4 marks]","Application layer: FQDN/host names.\nTransport layer: port numbers.\nNetwork layer: IP addresses (IPv4 32-bit, IPv6 128-bit).\nData Link layer: MAC address (48-bit, physical)."],
["Explain how DNS resolves a name, starting at the root. [5 marks]","The resolver asks a name server. The 13 root server clusters point to the right TLD server, which holds information about the authoritative servers. The authoritative server for the domain holds the name-to-IP records and returns the IP address. Name servers may cache answers. Queries can be recursive (demand an answer) or iterative (server answers only if it knows)."],
["Differentiate recursive and iterative queries. [2 marks]","Recursive: demands a resolution or the answer “can’t be found”. Iterative: the local server queries other servers, which only provide information if they have it and do not demand resolution."],

notes:[
["Encapsulation",["Layers 7–5 create the data (<b>payload</b>). Layer 4 (TCP/UDP) adds a header with a port number = <b>segment</b>. Layer 3 adds its header = <b>packet</b>. Layer 2 adds header and trailer = <b>frame</b>. Layer 1 sends <b>bits</b>","Receiver <b>de-encapsulates</b> in reverse order","Frame type field <code>0x0800</code> = IP. IP protocol field: <code>0x06</code> TCP, <code>0x11</code> UDP, <code>0x01</code> ICMP"]],
["OSI model (7 layers, ISO 1984)",["Application, Presentation, Session, Transport, Network, Data Link, Physical. Memory aid: <b>A</b>ll <b>P</b>eople <b>S</b>eem <b>T</b>o <b>N</b>eed <b>D</b>ata <b>P</b>rocessing","OSI says <b>what</b> must be done, not <b>how</b>. Why layers: reduces complexity, standardization, changes in one layer don’t affect others, different vendors’ hardware and software work together, easier to teach","<b>Session</b>: maintains an ongoing session. <b>Transport</b>: reliable delivery, segmenting, error detection. <b>Network</b>: network-wide addressing and routing (IP). <b>Physical</b>: cabling, topology, encoding, electrical specs","<b>Data Link</b> has two sublayers: <b>MAC</b> (gives data to the NIC, controls media access via CSMA/CD or token passing) and <b>LLC</b> (manages the interface, detects errors with CRC)"]],
["TCP/IP model (4 layers)",["Developed by DARPA in the late 1960s","Application, Transport, Internet, Network Access. OSI layers 5–7 map to Application; 1–2 map to Network Access","Application protocols: HTTP, FTP, TELNET, SMTP, SNMP, POP3 (deletes mail from the server after download), IMAP (keeps mail on the server, folders)","Transport: TCP, UDP. Internet: IP, ICMP"]],
["TCP, UDP, IP",["<b>TCP</b> (Transport): connection-oriented (<b>three-way handshake</b>), <b>sequencing and checksums</b>, <b>flow control</b>","Handshake: <b>SYN</b>, then <b>SYN/ACK</b>, then <b>ACK</b>, then data is sent","<b>UDP</b>: connectionless, no error checking or sequencing, so it is faster. Good for live audio/video. Header has 4 fields: source port, destination port, length, checksum (checksum optional in IPv4, required in IPv6)","<b>IP</b> (Network): specifies how and where data is delivered. <b>Unreliable and connectionless</b>: no guarantee of delivery and no connection set up first. It depends on TCP for reliability","<b>TTL</b>: decreases at each hop. At zero the packet is discarded and an ICMP message goes back to the sender"]],
["ICMP, IGMP, ARP",["<b>ICMP</b> (Network): reports success or failure of delivery (congestion, unreachable, TTL expired). It reports errors but does not correct them. Ping uses echo request and echo reply. ICMPv6 does the work of IGMP and ARP in IPv6","<b>IGMP</b> (IPv4): manages multicast group membership","<b>ARP</b> (Layer 2 using IP): finds the MAC address for a known IP on the <b>local network</b>, using <b>broadcast</b>. Stores results in the <b>ARP table</b> (dynamic or static entries). View with <code>arp -a</code>. IPv6 uses <b>NDP</b> instead"]],
["Routers and switches",["<b>Router</b>: joins networks, works at Layer 3 (often 4), picks the best path, reroutes around failures, connects LANs and WANs. Each router interface is its own <b>broadcast domain</b>. A switch does not break up broadcast domains","Router types: <b>interior</b> (within an autonomous system), <b>border</b> (AS to outside), <b>exterior</b> (between ASs)","<b>Layer 3 switch</b> works like a router but faster and cheaper. <b>Layer 4 switch</b> (content switch) filters on Layer 4 data","<b>Routing table</b>: database of where networks are and the next hop to reach them","<b>Static</b> routing: admin configures paths. <b>Dynamic</b>: router calculates and adapts automatically. <b>Gateway of last resort</b>: accepts all unroutable messages","View table: <code>route print</code> (Windows), <code>show ip route</code> (Cisco), <code>netstat -r</code>"]],
["Routing metrics and protocols",["<b>Metrics</b>: hop count, bandwidth, delay/latency, load, MTU, cost, reliability, topology","Protocol ratings: <b>Administrative distance</b> (reliability number), <b>convergence time</b> (time to find the best path after a change), <b>overhead</b> (burden on the network)","<b>IGP</b> (inside an AS): distance-vector (<b>RIP</b>: slowest, least secure) and link-state (<b>OSPF</b>, <b>IS-IS</b>). <b>EGP</b> (between ASs): only <b>BGP</b>, a path-vector protocol, the “protocol of the Internet”, uses ASNs","<b>OSPF</b>: no hop limit, fast convergence, more CPU/memory than RIP. <b>IS-IS</b>: similar to OSPF, interior only, easy to adapt to IPv6, preferred by service providers"]],
["Troubleshooting tools",["<b>netstat</b>: TCP/IP statistics, open ports and connections, errors per interface","<b>nbtstat</b>: NetBIOS names to IP addresses (legacy)","<b>tracert</b> (Windows, ICMP) / <b>traceroute</b> (Linux, UDP to a random port): shows every hop. Can stop early if the target is down, busy, or a firewall blocks the messages","<b>pathping</b>: ping + tracert combined, slow. Use <code>-q</code> to limit queries per hop","Problems: interface errors (start with ping, netstat), hardware failure (tracert, aim past the suspect router), <b>path MTU black hole</b> (messages lost: ping with growing sizes), missing routes (netstat -r)"]],
["IP addressing and subnetting",["Classes by first octet: <b>A 1–126</b> (16,777,214 hosts), <b>B 128–191</b> (65,534 hosts), <b>C 192–223</b> (254 hosts), <b>D 224–239</b> multicast, <b>E 240–255</b> experimental","Default masks: A 255.0.0.0 (/8), B 255.255.0.0 (/16), C 255.255.255.0 (/24)","Special: <code>0.0.0.0</code> default route, <code>127.0.0.0</code> loopback, host bits all 0 = network address, all 1 = broadcast. <code>255.255.255.255</code> = limited broadcast","Hosts per network = <b>2<sup>n</sup> − 2</b> (n = host bits). Network address = IP AND mask","Binary place values: <code>128 64 32 16 8 4 2 1</code>","<b>VLSM</b>: different mask lengths in one network to cut waste. Allocate the <b>largest</b> subnet first. <b>CIDR</b>: no classes, any prefix length. Routers use <b>longest prefix match</b>. <b>Route aggregation</b>: four /24s (10.24.0.0 to 10.24.3.0) become <code>10.24.0.0/22</code>"]],

["Describe the three characteristics of TCP. [3 marks]","1) Connection-oriented: a session is set up with the three-way handshake (SYN, SYN/ACK, ACK).\n2) Sequencing and checksums: each segment has a sequence number and a checksum checked by the receiver.\n3) Flow control: transmission rate is adjusted to how fast the recipient can accept data."],
["Explain: “IP is an unreliable, connectionless protocol.” How does IP overcome this? [3 marks]","Unreliable: IP does not guarantee delivery. Connectionless: no connection is established before data is sent. IP relies on TCP at the Transport layer (sequencing, acknowledgements, retransmission) to ensure reliable delivery, and on ICMP to report delivery failures."],
["Define routing metrics and give two examples. What do convergence time, overhead and administrative distance mean? [5 marks]","Routing metrics are route properties routers use to pick the best path, e.g. hop count, bandwidth, delay, load, MTU, cost, reliability.\nConvergence time: time to recognize a best path after a change or outage.\nOverhead: burden the protocol places on the network.\nAdministrative distance: number indicating the protocol’s reliability (lower is preferred)."],
["Explain the purpose of a routing table. [2 marks]","It is a database in a router listing networks (IP and mask), the next hop and interface to reach them, so the router can choose the most efficient path to forward each packet."],
["Describe how a DHCP client gets an IP address. [4 marks]","1) DHCP Discover: client broadcasts to find servers.\n2) DHCP Offer: server offers an IP and settings.\n3) DHCP Request: client broadcasts accepting one offer.\n4) DHCP ACK: server confirms the lease. (Renewal is attempted at 50% of the lease.)"],
["Give two advantages of the client/server model, and the purpose of a DNS server. [3 marks]","Advantages: centralized management and security, easier backups, scalable, shared resources.\nDNS server: translates domain names (FQDNs) to IP addresses."],
["Convert to binary: 122 and 253. Convert to decimal: 11101011 and 10111110. [4 marks]","122 = 01111010 (64+32+16+8+2)\n253 = 11111101 (128+64+32+16+8+4+1)\n11101011 = 235\n10111110 = 190"],
["Mask 255.255.255.240 on 194.1.2.0. (a) network bits (b) host bits (c) subnets (d) usable hosts (e) first two subnets with broadcasts. [6 marks]","(a) 28 network bits.\n(b) 4 host bits.\n(c) 4 bits borrowed from a Class C, so 2^4 = 16 subnets.\n(d) 2^4 − 2 = 14 usable hosts.\n(e) Subnet 1: 194.1.2.0, hosts .1–.14, broadcast 194.1.2.15.\nSubnet 2: 194.1.2.16, hosts .17–.30, broadcast 194.1.2.31."],
["Name the OSI PDUs for Network, Session and Physical layers. Give three goals of the OSI model. [4 marks]","Network = packet. Session = data. Physical = bits.\nGoals: reduce complexity, standardize interfaces between vendors, let different hardware and software work together, so a change in one layer does not affect others."],
["Network diagram: how do you find broadcast domains, and what do routers, switches and workstations do? [5 marks]","Each router interface (and the segment behind it) is a separate broadcast domain. Switches and hubs do not split broadcast domains, so everything connected through switches shares one.\nRouter: connects networks, chooses best paths. Switch: forwards frames by MAC address within a LAN. Workstation: end device that runs user applications."],
["VLSM: 192.168.1.0/24 must serve 30, 20 and 10 hosts. Give the subnets. [5 marks]","Largest first. 30 hosts needs 5 host bits (/27): 192.168.1.0/27 (hosts .1–.30).\n20 hosts needs 5 bits (/27): 192.168.1.32/27 (hosts .33–.62).\n10 hosts needs 4 bits (/28): 192.168.1.64/28 (hosts .65–.78)."]]},{name:"Chapter 10: Network Segmentation and Virtualization",
notes:[
["Segmentation, subnet masks, CIDR",["<b>Segmentation</b> = dividing a network into smaller networks. Each is its own <b>broadcast domain</b>. Benefits: enhance <b>security</b>, improve <b>performance</b>, simplify <b>troubleshooting</b>","IPv4 address = <b>network ID</b> + <b>host ID</b>. The <b>subnet mask</b> shows which is which. The number of 1s in the mask = number of network bits","<b>CIDR</b>: address followed by / and the number of network bits, e.g. <code>192.168.89.127/24</code> (a CIDR block)","Example scenario: a business with a few hundred computers on three floors puts each floor on its own LAN (broadcast domain)"]],
["How to do subnetting calculations",["<b>Subnets = 2<sup>s</sup></b> (s = bits borrowed from the host part). <b>Hosts = 2<sup>h</sup> − 2</b> (h = host bits left). Total bits must fit: default network bits + s + h ≤ 32","Steps: 1) identify the class and default mask. 2) Find smallest s with 2<sup>s</sup> ≥ subnets needed. 3) Find smallest h with 2<sup>h</sup> − 2 ≥ hosts needed. 4) New prefix = default prefix + s. 5) Convert to a mask by adding binary place values <code>128 64 32 16 8 4 2 1</code>","Common last-octet masks: /25 = 128, /26 = 192, /27 = 224, /28 = 240, /29 = 248, /30 = 252","<b>Block size</b> = 256 − mask octet (e.g. 240 gives 16). Subnets start at 0, 16, 32…. Broadcast = next subnet − 1. Usable range = network + 1 to broadcast − 1","Class A default /8, B /16, C /24"]],
["Supernetting and IPv6 subnetting",["<b>Supernetting</b>: combine contiguous networks with the same CIDR block into one supernet. Also called classless routing. Reasons: <b>fewer routing table entries</b>, and make one network from <b>more than one Class C</b>. The supernet mask moves the prefix to the <b>left</b>","<b>IPv6 subnetting</b> is simpler: no classes, no subnet masks. First 64 bits (four blocks) = <b>network/routing prefix</b>. Slash notation is the prefix mask, e.g. <code>2608:FE10::/32</code> covers all subnets starting 2608:FE10. Interfaces sharing a prefix are on the same subnet"]],
["Virtualization basics",["Emulation of a computer, OS environment or application on a physical system. <b>VM</b> = virtual workstation or server","<b>Host</b> = physical computer. <b>Guest</b> = each VM. <b>Hypervisor</b> (virtual machine manager) = software that creates and manages VMs","Advantages: efficient resource use, cost and energy savings, fault and threat isolation, simple backup/recovery/replication","Disadvantages: compromised performance, more complexity, higher licensing costs, <b>single point of failure</b>","Products: VMware (most widely used), Hyper-V, KVM, VirtualBox, Citrix XenApp"]],
["Virtual networking",["Each VM uses a <b>vNIC</b> (virtual adapter). A VM can have several. Each vNIC is automatically given a <b>MAC address</b>","<b>Virtual switch</b>: logical device at the Data Link layer that passes frames between nodes. Controlled by the hypervisor","<b>Bridged mode</b>: vNIC uses the host’s NIC to reach the physical network and gets its own IP, gateway and mask from the physical LAN’s DHCP","<b>NAT mode</b>: vNIC relies on the host as a NAT device and gets addressing from the host (the virtualization software acts as DHCP). Suitable when the VM doesn’t need a known address","<b>Host-only mode</b>: VMs on the host talk to each other and the host only. Nothing beyond the host, never uses the host’s physical NIC","<b>Virtual appliance</b>: image of OS, software, hardware specs and configuration. Typical functions: firewall, network management, email, remote access"]],
["VRRP/HSRP and SDN",["<b>VRRP</b> assigns one <b>virtual IP</b> to a group of physical routers acting as one. The master router handles messages sent to it. <b>HSRP</b> is Cisco’s proprietary version","<b>SDN</b> (software defined networking): virtualization of network services managed by a <b>network controller</b>. <b>Control plane</b> = makes decisions. <b>Data plane</b> = physical devices that move the data"]],
["VLANs and trunking",["<b>VLAN</b>: groups switch ports so some traffic must go through a router. Needs a programmable (<b>managed</b>) switch. Each VLAN normally = its own subnet and broadcast domain. Can span multiple switches","<b>802.1Q</b>: IEEE standard for VLAN tags in frames","Reasons: separate groups needing special security, isolate heavy traffic, give priority to certain devices, contain legacy protocols, break a large network into smaller subnets","<b>Trunk</b>: one physical link carrying many VLANs. <b>Access port</b> = one node. <b>Trunk port</b> = multiple VLANs. Frames carry a VLAN tag","<b>VTP</b> (Cisco): shares the VLAN database from the stack master to other switches","Different VLANs talk through a <b>router or Layer 3 switch</b>","<b>VLAN hopping attack</b>: attacker sends traffic that looks like it belongs to a protected VLAN. Prevent by disabling auto trunking and moving the native VLAN to an unused VLAN"]],
["STP and switches",["<b>STP</b> (802.1D, Data Link): prevents <b>loops</b> and broadcast storms by blocking links. Switches share <b>BPDUs</b>. Steps: choose <b>root bridge</b> (lowest Bridge ID), examine paths, disable links not on the shortest path","Faster: <b>RSTP</b>, <b>MSTP</b>. <b>TRILL</b> and <b>SPB</b> are newer multipath alternatives","<b>Unmanaged switch</b>: plug and play, no IP. <b>Managed switch</b>: CLI, has an IP, needed for VLANs. Options: password security, console, AAA, port security, speed and duplex","<b>Wireless controller</b> centrally manages APs. <b>Thick AP</b> is self-contained. <b>Thin AP</b> is configured from the controller. <b>LWAPP/CAPWAP</b> send wireless frames to the controller","To put a VM in a VLAN, change the <b>virtual switch</b> configuration in the hypervisor"]]],
quiz:[
q("Each subnet is its own:",["Collision domain only","Broadcast domain","VLAN trunk","DNS zone"],1,"Segmenting creates separate broadcast domains."),
q("In a subnet mask, the number of 1s tells you:",["Number of hosts","Number of network ID bits","Number of routers","The class"],1,"The 1s mark the network portion."),
q("192.168.89.127/24: what does 24 represent?",["Hosts","Number of 1s in the mask / network bits","Subnets","Octets"],1,"/24 = 24 network bits = 255.255.255.0."),
q("Mask 255.255.255.240 is:",["/26","/27","/28","/29"],2,"240 = 11110000, four 1s in the last octet, so 24 + 4 = /28."),
q("Usable hosts in a /26:",["64","62","60","30"],1,"6 host bits: 2^6 − 2 = 62."),
q("Class C network, need 6 subnets. Bits to borrow?",["2","3","4","6"],1,"2^3 = 8 ≥ 6. Mask becomes /27 (255.255.255.224)."),
q("Supernetting is useful because it:",["Adds routing table entries","Reduces routing table entries","Splits broadcast domains","Encrypts traffic"],1,"It combines contiguous networks into one entry."),
q("In IPv6 subnetting, the network prefix is normally:",["First 32 bits","First 64 bits","Last 64 bits","First 16 bits"],1,"The first four blocks (64 bits) are the routing prefix."),
q("The software that creates and manages VMs is the:",["Hypervisor","Guest","vNIC","Appliance"],0,"Also called the virtual machine manager."),
q("Which vNIC mode lets VMs talk only to each other and the host?",["Bridged","NAT","Host-only","Trunk"],2,"Host-only never uses the host’s physical NIC."),
q("In bridged mode, the VM gets its IP address from:",["The host’s virtual DHCP","The physical LAN’s DHCP server","APIPA only","A DNS server"],1,"It acts like its own device on the physical network."),
q("A virtual switch operates at which layer?",["Physical","Data Link","Network","Transport"],1,"It passes frames, so Layer 2."),
q("Which is a disadvantage of virtualization?",["Cost savings","Single point of failure","Easy backups","Threat isolation"],1,"If the host fails, all its VMs fail."),
q("VRRP assigns:",["A virtual IP shared by a group of routers","VLAN IDs","MAC addresses to VMs","DNS names"],0,"HSRP is Cisco’s proprietary version."),
q("In SDN, the control plane:",["Moves the data","Makes decisions","Is the cabling","Is the vNIC"],1,"The data plane is the physical devices that carry traffic."),
q("Which standard defines VLAN tagging?",["802.1D","802.1Q","802.11","802.3af"],1,"802.1Q = VLANs. 802.1D = STP."),
q("A port that carries traffic for multiple VLANs is a:",["Access port","Trunk port","Console port","Mirror port"],1,"Access port is for a single node."),
q("Devices in different VLANs communicate through:",["A hub","A router or Layer 3 switch","A repeater","Nothing needed"],1,"VLANs are separate subnets, so routing is required."),
q("STP is used to:",["Prevent switching loops","Assign VLANs","Encrypt frames","Translate addresses"],0,"It blocks redundant links using BPDUs."),
q("VLANs can only be implemented on:",["Unmanaged switches","Hubs","Managed switches","Repeaters"],2,"Unmanaged switches have no configuration.")],
written:[
["Problem 1: Class C 192.10.10.0. Needs 14 subnets and 14 usable hosts. Find class, masks, subnets, hosts, bits borrowed.","Class C, default 255.255.255.0.\nSubnets: 2^4 = 16 ≥ 14, so borrow 4 bits.\nHosts: 2^4 − 2 = 14 usable (4 host bits).\nCustom mask 255.255.255.240 (/28).\nTotal subnets 16, total host addresses 16, usable 14, bits borrowed 4."],
["Problem 2: 165.100.0.0. Needs 1000 subnets and 60 hosts.","Class B, default 255.255.0.0.\nSubnets: 2^10 = 1024 ≥ 1000, borrow 10 bits.\nHosts: 6 host bits, 2^6 − 2 = 62 ≥ 60.\nCustom mask 255.255.255.192 (/26).\nTotal subnets 1,024, host addresses 64, usable 62, bits borrowed 10."],
["Problem 3: 148.75.0.0 /26. Find the details.","Class B (148). /26 = 255.255.255.192.\nBits borrowed = 26 − 16 = 10, so 1,024 subnets.\nHost bits = 6: 64 addresses, 62 usable."],
["Problem 4: 210.100.56.0. Needs 6 subnets and 30 hosts.","Class C, default 255.255.255.0.\nSubnets: 2^3 = 8 ≥ 6, borrow 3 bits.\nHosts: 2^5 − 2 = 30.\nCustom mask 255.255.255.224 (/27).\nTotal subnets 8, host addresses 32, usable 30, bits borrowed 3."],
["Problem 5: 195.85.8.0. Needs 6 subnets and 30 hosts.","Class C (195). Same numbers as Problem 4: mask 255.255.255.224 (/27), 8 subnets, 32 addresses, 30 usable, 3 bits borrowed."],
["Problem 6: 118.0.0.0. Needs 126 subnets and 131,070 hosts.","Class A, default 255.0.0.0.\nSubnets: 2^7 = 128 ≥ 126, borrow 7 bits.\nHosts: 131,070 = 2^17 − 2, so 17 host bits (7 + 17 = 24, fits).\nCustom mask 255.254.0.0 (/15).\nTotal subnets 128, host addresses 131,072, usable 131,070, bits borrowed 7."],
["Problem 7: 178.100.0.0. Needs 2000 subnets and 15 hosts.","Class B, default 255.255.0.0.\nSubnets: 2^11 = 2048 ≥ 2000, borrow 11 bits.\nHosts: 2^4 − 2 = 14 is too few, so 5 host bits: 2^5 − 2 = 30 ≥ 15 (11 + 5 = 16, fits).\nCustom mask 255.255.255.224 (/27).\nTotal subnets 2,048, host addresses 32, usable 30, bits borrowed 11."],
["Compare bridged, NAT and host-only vNIC modes. [6 marks]","Bridged: uses the host NIC, gets its own IP from the physical LAN DHCP, visible to other nodes.\nNAT: host acts as NAT device and DHCP server, VM reachable outward but not at a known address.\nHost-only: VMs and host only, no access beyond the host."],
["What is a VLAN, why use one, and how do VLANs exchange data? [5 marks]","A VLAN groups switch ports into a logical network (own subnet, own broadcast domain) that can span switches (802.1Q tags, trunk links). Used for security, isolating heavy traffic, prioritizing devices, containing legacy protocols and splitting large networks. VLANs exchange data via a router or Layer 3 switch."],
["State three advantages and three disadvantages of virtualization. [6 marks]","Advantages: efficient resource use, cost/energy savings, fault and threat isolation, simple backup and recovery.\nDisadvantages: compromised performance, increased complexity, increased licensing costs, single point of failure."],
["Explain STP: purpose and three steps. [4 marks]","STP (802.1D) prevents traffic loops and broadcast storms by blocking redundant links. Steps: select the root bridge by Bridge ID, examine possible paths from each bridge to the root, disable links not part of the shortest path. Switches exchange BPDUs."]]},{name:"Chapter 5: Network Cabling",
notes:[
["Signaling and modulation",["<b>Analog</b> signal varies continuously. Four properties: <b>amplitude</b> (strength), <b>frequency</b> (cycles over time), <b>wavelength</b> (peak to peak), <b>phase</b>. Drawback: susceptible to flaws","<b>Digital</b> signal = pulses of voltage: positive = 1, zero = 0","<b>Modem</b> = modulator/demodulator. <b>Modulation</b> changes a carrier wave with a data wave. Types: <b>frequency modulation</b>, <b>amplitude modulation</b>. DSL uses modulation"]],
["Baseband, broadband, multiplexing",["<b>Baseband</b>: digital signals on a single channel, uses the whole wire capacity (Ethernet)","<b>Broadband</b>: many signals share one medium using <b>multiplexing</b> (cable TV, cable Internet)","<b>Mux</b> combines at the sender, <b>demux</b> separates at the receiver","<b>TDM</b>: time slots. <b>Statistical multiplexing</b>: slots by priority/need, more efficient than TDM. <b>FDM</b>: a frequency band per channel (cellular, DSL). <b>WDM</b>: multiple light signals on one fiber. <b>DWDM</b>: dense, high capacity, long WAN links. <b>CWDM</b>: cheaper, channels spaced wider","<b>Throughput</b> = data actually transmitted per time (effective rate). <b>Bandwidth</b> (strict) = highest minus lowest frequency a medium can carry"]],
["Twisted pair: STP and UTP",["Color-coded insulated copper pairs, twisted. More twists per foot = more resistance to <b>crosstalk</b>, higher quality, more expensive","Standard: <b>TIA/EIA 568</b>. Categories 3, 5, 5e, 6, 6a, 7. <b>CAT 5e or higher</b> for modern LANs","<b>STP</b>: pairs wrapped in metallic shielding (foil), more noise resistant, may be grounded. <b>UTP</b>: no extra shielding, cheaper, less noise resistance","Both: same throughput, <b>RJ-45</b> connectors, max segment <b>100 m</b>","Advantages: inexpensive, flexible, easy to install, supports many topologies"]],
["Cable pinouts",["<b>568A</b> and <b>568B</b>: no functional difference, but use the same on every plug","<b>Straight-through</b>: same pinout both ends (connects different devices, e.g. PC to switch)","<b>Crossover</b>: transmit and receive pairs swapped on one end (like devices)","<b>Rollover</b> (Yost, Cisco console cable): pinout is a mirror image. Connects a computer to a router’s <b>console port</b>","<b>Media converter</b>: connects different media types. <b>Coupler</b>: passes data through a same-type connection unchanged"]],
["PoE",["<b>Power over Ethernet</b>, IEEE <b>802.3af</b>: 15.4 W. <b>PoE+</b> (802.3at): 25.5 W","<b>PSE</b> = power sourcing equipment. <b>PD</b> = powered device. The PSE first checks that the device is PoE-capable"]],
["Fiber-optic cable",["Core (glass/plastic) carries light pulses from a laser or LED. <b>Cladding</b> reflects light back into the core. Then a buffer, <b>Kevlar</b> strands, and a sheath","Benefits: very high throughput (up to 100 Gbps per channel), noise immunity (no EMI), security, long distances. Drawbacks: most expensive, special equipment to splice","<b>SMF</b>: narrow core (8–10 microns), laser, one path, longest distances, Internet backbone","<b>MMF</b>: wider core (50 or 62.5 microns), LED or laser, more attenuation, shorter links (router to switch, server backbone)","Connectors: <b>LC</b> (1.25 mm, most common), <b>SC</b>, <b>ST</b>, <b>FC</b> (2.5 mm), <b>MT-RJ</b> (common MMF). <b>Ferrule</b> = connector tip. Polishes: PC, UPC, APC","Modules: <b>GBIC</b> (Gigabit), <b>SFP</b> (mini GBIC, more ports per inch; XFP and SFP+). <b>Loopback adapter</b> tests an SFP"]],
["Transmission flaws",["<b>Noise</b>: unwanted influence. <b>EMI</b>: e.g. radio frequency interference","<b>Crosstalk</b>: signal on one wire affects another. <b>NEXT</b> near end, <b>FEXT</b> far end, <b>alien</b> between cables","<b>Attenuation</b>: signal loses strength with distance. <b>Amplifier</b> boosts the signal and the noise. <b>Repeater</b> regenerates a clean digital signal","<b>Latency</b>: delay from send to receipt (cable length, devices). <b>RTT</b> = round trip time","Fiber problems: <b>core/type mismatch</b>, <b>wavelength mismatch</b>, <b>dirty connectors</b>"]],
["Cable troubleshooting tools",["<b>Toner and probe</b> (tone generator + locator): find where a wire pair terminates. Doesn’t test cable quality","<b>Multimeter</b>: resistance, voltage, impedance. Detects shorts, opens, noise","<b>Continuity tester</b>: does the cable carry the signal, are pairs correct (not shorted or crossed). Fiber version sends light pulses","<b>Cable performance tester / certifier</b>: also measures distance to fault, attenuation, NEXT, impedance, gives pass/fail for Cat 3–7 and stores results","<b>TDR</b>: sends a signal and measures the bounce to find distance to a fault and check terminators. <b>OTDR</b>: same for fiber (breaks, bad splices, bends), expensive","<b>OPM</b> (optical power meter): measures light power on fiber"]]],
quiz:[
q("Which is NOT a property of an analog signal?",["Amplitude","Frequency","Phase","Checksum"],3,"The four are amplitude, frequency, wavelength and phase."),
q("A modem:",["Modulates and demodulates","Amplifies noise","Routes packets","Assigns IPs"],0,"Modulator/demodulator."),
q("Ethernet uses which transmission type?",["Broadband","Baseband","Satellite","Analog"],1,"Baseband uses the whole channel for one signal."),
q("Which multiplexing carries multiple light signals on one fiber?",["TDM","FDM","WDM","Statistical"],2,"WDM, with DWDM (dense) and CWDM (coarse)."),
q("Which is cheaper but spaces channels further apart?",["DWDM","CWDM","FDM","TDM"],1,"CWDM was developed to lower transceiver cost."),
q("Maximum segment length for UTP/STP is:",["50 m","100 m","185 m","500 m"],1,"100 metres for both."),
q("Which connector do UTP and STP both use?",["RJ-45","LC","BNC","ST"],0,"RJ-45 (RJ-48 is for T-1)."),
q("Which is the main advantage of STP over UTP?",["Cheaper","Better noise immunity","Longer segment length","Higher throughput"],1,"Same throughput and 100 m limit. STP resists noise better."),
q("A rollover cable is used to:",["Connect two switches","Connect a PC to a router console port","Connect two PCs","Extend fiber"],1,"Also called Yost or Cisco console cable."),
q("PoE 802.3af supplies up to:",["15.4 W","25.5 W","60 W","5 W"],0,"PoE+ (802.3at) provides 25.5 W."),
q("Which fiber type has the narrowest core and longest range?",["MMF","SMF","POF","Coax"],1,"SMF: 8–10 microns, laser, Internet backbone."),
q("The most common 1.25 mm fiber connector is:",["SC","ST","FC","LC"],3,"LC is the common small ferrule connector."),
q("Crosstalk occurring at the source end is:",["FEXT","NEXT","Alien","EMI"],1,"Near end crosstalk."),
q("What regenerates a digital signal without accumulated noise?",["Amplifier","Repeater","Multimeter","Splitter"],1,"An amplifier would boost the noise too."),
q("A tool that measures distance to a cable fault by signal bounce is a:",["Toner","Multimeter","TDR","Loopback"],2,"OTDR does the same for fiber."),
q("Which tool locates where a wire pair terminates?",["Tone generator and locator","OPM","Certifier","OTDR"],0,"Toner and probe kit."),
q("Which measures light power on a fiber link?",["TDR","Multimeter","OPM","Toner"],2,"Optical power meter."),
q("Dirty connectors, core mismatch and wavelength mismatch are common problems for:",["UTP","Coax","Fiber","Wireless"],2,"They are listed as common fiber cable problems."),
q("Throughput is:",["Range of frequencies","Actual data transmitted per time period","Delay","Signal strength"],1,"Also called effective data rate or payload rate."),
q("CAT __ or higher is used in modern LANs.",["3","5","5e","2"],2,"CAT 5e or higher.")],
written:[
["Differentiate baseband and broadband, and name four types of multiplexing. [5 marks]","Baseband: digital signals on a single channel, using the whole capacity (Ethernet). Broadband: multiple transmissions share one medium via multiplexing (cable Internet).\nTypes: TDM, statistical multiplexing, FDM, WDM (DWDM/CWDM)."],
["Compare STP and UTP. [4 marks]","Same throughput, RJ-45 connectors and 100 m limit. STP has individually insulated pairs plus metallic shielding so better noise immunity (and can be grounded). UTP has no extra shielding, cheaper, less noise resistance."],
["Explain straight-through, crossover and rollover cables. [3 marks]","Straight-through: identical pinouts, connects unlike devices. Crossover: transmit/receive pairs reversed at one end, connects like devices. Rollover: mirror-image pinout, connects a computer to a router console port."],
["Compare single-mode and multimode fiber. [4 marks]","SMF: 8–10 micron core, laser light on one path, little dispersion, longest distances, expensive, Internet backbone. MMF: 50/62.5 micron core, LED or laser at many angles, more attenuation, shorter links such as router to switch."],
["Define attenuation, crosstalk and latency, and name a tool for each kind of cable problem. [6 marks]","Attenuation: loss of signal strength over distance (fix with repeater). Crosstalk: a signal on one wire interfering with an adjacent one (NEXT, FEXT). Latency: delay between sending and receiving.\nTools: toner/probe (find pair), multimeter (voltage, shorts), continuity tester, certifier (attenuation, NEXT), TDR/OTDR (distance to fault), OPM (fiber light power)."]]},{name:"Chapter 6: Wireless Networking",
notes:[
["Wireless basics",["WLANs send signals through the air as <b>radio frequency (RF)</b> waves. They use the same Layer 3+ protocols as wired networks","Spectrum: 9 KHz to 300 GHz. <b>FCC</b> regulates the US, <b>ITU</b> international","<b>Directional antenna</b>: one direction. <b>Omnidirectional</b>: equal in all directions. Radiation pattern, range","<b>2.4 GHz</b> band (older): 11 unlicensed channels, prone to interference. <b>5 GHz</b> band (newer): 24 unlicensed 20 MHz bands"]],
["Signal propagation and degradation",["<b>LOS</b> = line of sight. Obstacles can cause: <b>reflection</b> (bounces back), <b>diffraction</b> (splits into secondary waves), <b>scattering</b> (diffuses in many directions), or the signal passes through or is absorbed","<b>Multipath</b>: signals arrive via different paths. Advantage: better chance of arriving. Disadvantage: delays cause data errors","<b>Fading</b>: variation in signal strength (multipath is a cause). <b>Attenuation</b>: weakens with distance (fix: range extender). <b>Noise/EMI</b>: wireless has no shielding. <b>SNR</b> = signal-to-noise ratio","<b>Goodput</b>: throughput at the application level"]],
["Wireless PANs",["WPANs reach only a few meters. Technologies: <b>Bluetooth</b>, <b>Infrared (IR)</b>, <b>NFC</b>","<b>Bluetooth</b>: 2.4–2.485 GHz, <b>frequency hopping</b>, devices must be <b>paired</b>. <b>Bluejacking</b> = sending unsolicited data. <b>Bluesnarfing</b> = downloading data without permission","<b>NFC</b>: very short distance radio. An NFC tag (smart tag) gets power from the phone by magnetic induction"]],
["WLAN architecture",["<b>Ad hoc</b>: nodes talk directly, no access point","<b>Infrastructure</b>: stations talk to a <b>WAP</b>, not to each other","<b>Mesh</b>: several APs, more fault tolerant","AP range about 300 ft. Directional antennas can link two LANs up to 1000 ft apart"]],
["802.11 standards and access method",["Standards: <b>802.11 b, a, g, n, ac</b>. All use <b>half-duplex</b>. They differ at the Physical layer","Wireless can’t detect collisions, so uses <b>CSMA/CA</b> (collision <b>avoidance</b>), with <b>ACK</b> packets confirming each transmission. Ethernet uses CSMA/CD (detection)","<b>RTS/CTS</b>: request to send / clear to send, helps large packets, lowers efficiency","Real throughput is below theoretical maximum"]],
["Association and frames",["<b>Association</b>: exchange between client and AP to get access. <b>Active scanning</b> = client sends a <b>probe</b>. <b>Passive scanning</b> = client listens for a <b>beacon</b>","<b>SSID</b>: unique name of the AP/network. <b>BSS</b>: stations sharing one AP (BSSID). <b>ESS</b>: several APs on the same LAN sharing an ESSID, enables <b>roaming</b>","<b>Reassociation</b>: moving from one AP to another","Frame types: <b>management</b> (association), <b>control</b> (ACK, RTS/CTS), <b>data</b>","Risk: a client picking the strongest signal may connect to a rogue AP"]],
["Wireless innovations",["<b>MIMO</b>: multiple antennas raise throughput and range. <b>MU-MIMO</b>: serves multiple clients at once (802.11ac Wave 2)","<b>Channel bonding</b>: two 20 MHz channels make 40 MHz, doubling bandwidth","<b>Frame aggregation</b> (A-MSDU, A-MPDU): combine frames to reduce overhead","802.11n real throughput 65–500 Mbps. 802.11ac Wave 1 up to 561 Mbps per client"]],
["Design and configuration",["A <b>site survey</b> assesses needs and facility, and decides AP placement. APs must share the same ESS and ESSID","Install settings: admin password, SSID, DHCP, SSID broadcast, security options","<b>On-boarding</b>: install a program/app to give a device trusted access. <b>Off-boarding</b>: remove it"]],
["Wireless security",["802.11 has <b>no security by default</b>. SSID only. Options: <b>MAC filtering</b>, encryption","<b>WEP</b> replaced by <b>WPA</b> (every transmission gets its own key), then <b>WPA2</b> (stronger). <b>WPA2-Enterprise</b> adds a <b>RADIUS</b> server","Threats: <b>war driving</b> (driving around scanning for open networks), <b>war chalking</b> (marking vulnerable APs), <b>evil twin</b> (rogue AP posing as real), <b>WPA cracking</b>, <b>WPS attack</b> (brute-forcing the PIN)"]],
["Troubleshooting wireless",["Cable testers can’t troubleshoot wireless. Use <b>Wi-Fi analyzer</b> and <b>spectrum analyzer</b> (signal quality). <code>iwconfig</code> on Linux","Pitfalls: SSID mismatch, wrong encryption, overlapping channels, mismatched standards, bad antenna placement or type, interference, wired and wireless connected simultaneously, firmware problems, poor AP power levels, client saturation"]]],

["Explain reflection, diffraction, scattering and multipath. [4 marks]","Reflection: signal bounces back toward its source. Diffraction: signal splits into secondary waves around an obstacle. Scattering: signal diffuses in many directions. Multipath: signals reach the receiver by different paths due to these effects; can improve reach but delays cause errors and fading."],
["Compare ad hoc, infrastructure and mesh WLANs. [3 marks]","Ad hoc: nodes communicate directly. Infrastructure: stations communicate through a WAP. Mesh: several APs for fault tolerant access."],
["Why does 802.11 use CSMA/CA, and how does it work? [4 marks]","Wireless devices can’t transmit and receive at once and can’t detect collisions, so they avoid them. Each transmission is verified by an ACK. RTS/CTS can reserve the medium for large packets. It adds overhead, so real throughput is below the theoretical maximum."],

notes:[
["WAN essentials",["<b>WAN</b> connects LANs over distance. LANs connect nodes; WANs connect <b>networks</b>. LAN wiring is privately owned. WAN wiring is public through <b>NSPs</b> (AT&T, Verizon, Comcast)","<b>WAN site</b> = a location. <b>WAN link</b> = connection between sites","<b>DTE</b> = customer’s endpoint device (talks to the LAN). <b>DCE</b> = carrier’s endpoint device (talks to the WAN)"]],
["WAN topologies",["<b>Bus</b>: each site connects serially to max two others, point-to-point links, not scalable","<b>Ring</b>: each site connects to two others, redundant rings reroute on failure, expansion difficult and expensive, best for max five locations","<b>Star</b>: central site. A single link failure affects one site, expansion is easy, but central site failure can bring down the whole WAN","<b>Mesh</b>: most fault tolerant. <b>Full mesh</b> = every site to every site (costly). <b>Partial mesh</b> = cheaper","<b>Tiered</b>: stars or rings at different levels, hierarchical"]],
["PSTN and T-carriers",["<b>PSTN</b> (also POTS): the telephone system. <b>CO</b> = central office. <b>Local loop</b> (last mile) = customer to nearest CO. <b>NIU</b> = termination at the demarcation point","<b>FTTP</b>: fiber to the premises. <b>PON</b> uses fiber to many endpoints: <b>OLT</b> at the carrier CO, <b>ONU</b> distributes to endpoints","<b>T-carriers</b> (T1, fractional T1, T3) use <b>TDM</b>. <b>DS0</b> = one 64 Kbps channel. <b>T1 = 24 channels</b> (1.544 Mbps). <b>T3 = 28 T1s</b>","Fractional T1: lease some channels. Good if you expect growth","T1 on copper terminates in an <b>RJ-48</b> connector at a <b>smart jack</b> (demarc). STP T1s need a repeater about every 6000 ft","<b>CSU/DSU</b> = T1 connection point. The <b>DTE is typically a router</b>"]],
["Frame relay, DSL, cable",["<b>Frame relay</b>: Layer 2, packet switched, connection-oriented. <b>DLCI</b> identifies the circuit. <b>PVC</b> = permanent virtual circuit (set up in advance). <b>SVC</b> = switched (set up per transmission). Cheaper, pay for bandwidth you use","<b>DSL</b>: operates over the PSTN, uses modulation. <b>ADSL</b> = asymmetric (downstream faster), most popular. <b>Symmetrical</b> (HDSL, SDSL, SHDSL) equal both ways. A <b>splitter</b> separates voice and data. <b>DSLAM</b> at the carrier. VDSL: up to 52 Mbps, max about 1000 ft. ADSL2+M: 24 Mbps down, 3.3 Mbps up","<b>Broadband cable</b>: coaxial TV wiring, <b>cable modem</b>, <b>HFC</b> (hybrid fiber-coax). <b>Shared</b> line, so real speeds are lower (about 10 Mbps down, 3 Mbps up)"]],
["ATM, SONET, MPLS, Metro Ethernet",["<b>ATM</b>: Data Link layer, fixed <b>53-byte cell</b> (48 data + 5 header), virtual circuits, guaranteed <b>QoS</b>, 25–622 Mbps, expensive. <b>LANE</b> integrates with Ethernet","<b>SONET</b>: fiber, <b>synchronous</b>, self-healing rings, speed by <b>OC level</b>. International name: <b>SDH</b>","<b>MPLS</b>: very fast, carries many payload types, ISPs use it to connect branch offices","<b>Metro Ethernet</b> (MEF, Carrier-Ethernet Transport): Ethernet across MAN/WAN. Advantages: streamlined, cost efficient, scalable, familiar, hardware"]],
["Wireless WANs",["<b>WiMAX (802.16)</b>: line-of-sight between fixed antennas, up to 30 miles, uses MIMO, QoS, good for rural. <b>WiMAX 2</b> = 802.16m","<b>Cellular</b>: 1G analog, 2G digital (240 Kbps), 3G (384 Kbps, <b>HSPA+</b>), 4G all-IP packet switched (<b>LTE</b>). Voice tech: <b>GSM</b> or <b>CDMA</b>. Base stations connect to an <b>MSC/MTSO</b>","<b>Satellite</b>: <b>GEO</b> orbit = same rate as Earth turns. Bands: L, S, C, Ku, K, Ka. Uplink and downlink frequencies differ. Asymmetrical, shared, high latency, expensive equipment"]],
["WAN troubleshooting",["Policies: fair access, throttling, blocking","<b>CPE</b> = customer premise equipment (anything on the customer side, regardless of owner). ISP-owned equipment should only be serviced by the ISP","Common problems: interface errors, routing loops, router misconfiguration, DNS issues, interference"]],
["DHCP (instructor slides)",["DHCP automates IP allocation. Three mechanisms: <b>manual</b>, <b>automatic</b>, <b>dynamic</b>","Messages: <b>DISCOVER</b> (client broadcast), <b>OFFER</b> (server, unicast), <b>REQUEST</b> (client broadcast), <b>ACK</b> (server, unicast)","<b>Renewal</b> starts at <b>50%</b> of the lease (unicast request). <b>Rebinding</b> at <b>12.5%</b> remaining (broadcast). If not renewed the address is <b>released</b>","Pools can be <b>global</b> or <b>interface</b> based. Exclude addresses like the gateway and DNS server from the pool. Huawei commands: <code>dhcp enable</code>, <code>dhcp select interface</code>, <code>dhcp server lease day 3</code>, <code>ip pool</code>"]]],

let S={c:0,t:"notes",qi:0,sc:0,ans:null,ord:[],done:false,d:{}};
function maskStr(p){return [0,1,2,3].map(i=>{const b=Math.max(0,Math.min(8,p-8*i));return 256-2**(8-b)}).join(".")}
function ip2n(s){return s.split(".").reduce((a,b)=>a*256+(+b),0)}
function n2ip(n){return [24,16,8,0].map(s=>Math.floor(n/2**s)%256).join(".")}
function sub(){const o=$("sip");if(!o)return;const ip=o.value.trim(),p=+$("spf").value,a=ip.split("."),r=$("sout");
if(a.length!=4||a.some(x=>x===""||isNaN(x)||x<0||x>255)){r.textContent="Enter a valid IPv4 address, e.g. 192.168.1.7";return}
const n=ip2n(ip),sz=2**(32-p),net=Math.floor(n/sz)*sz,bc=net+sz-1,f=+a[0],def=f<128?8:f<192?16:24;
r.innerHTML=`Mask: <code>${maskStr(p)}</code> (/${p})<br>Network: <code>${n2ip(net)}</code><br>Broadcast: <code>${n2ip(bc)}</code><br>Valid hosts: <code>${p>30?"none":n2ip(net+1)+" to "+n2ip(bc-1)}</code><br>Host bits: ${32-p}, so usable hosts = 2<sup>${32-p}</sup> − 2 = ${p>30?0:sz-2}`+(p>=def?`<br>Bits borrowed (classful /${def}): ${p-def}, so subnets = ${2**(p-def)}`:"")}
function newBin(){S.d.bin={n:rnd(256),dir:rnd(2),show:false}}
function binShow(){S.d.bin.show=true;render()}
function newSP(){const c=rnd(2),tot=c?16:8,sb=2+rnd(c?9:4),hb=2+rnd(tot-sb-1);S.d.sp={cls:c?"B":"C",net:c?(128+rnd(64))+"."+rnd(256)+".0.0":(192+rnd(31))+"."+rnd(256)+"."+rnd(256)+".0",s:2**(sb-1)+1+rnd(2**(sb-1)),h:2**(hb-1)-1+rnd(2**(hb-1)),sb,hbits:tot-sb,p:(c?16:24)+sb,show:false}}
function spShow(){S.d.sp.show=true;render()}
function subCards(){if(!S.d.bin)newBin();if(!S.d.sp)newSP();const b=S.d.bin,s=S.d.sp,inp="font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)";return `<div class="card"><h3>Subnet calculator</h3><div class="row"><input id="sip" value="${S.d.sip||"192.168.1.7"}" oninput="S.d.sip=this.value;sub()" style="flex:2;min-width:150px;${inp}"><select id="spf" onchange="S.d.spf=this.value;sub()">${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${(S.d.spf||24)==i+1?"selected":""}>/${i+1}</option>`).join("")}</select></div><div class="why" id="sout"></div><p class="sub">Use it to check your own working. In the exam you must show the steps.</p></div>
<div class="card"><h3>Drill 3: Binary and decimal</h3><div class="big">${b.dir?b.n.toString(2).padStart(8,"0"):b.n}</div>${b.show?`<div class="why"><code>${b.dir?b.n:b.n.toString(2).padStart(8,"0")}</code> (place values 128 64 32 16 8 4 2 1)</div>`:`<button class="btn pri" onclick="binShow()">Show answer</button>`} <button class="btn" onclick="newBin();render()">New one</button></div>
<div class="card"><h3>Drill 4: Custom subnet mask problem</h3><p>Network <code>${s.net}</code> (Class ${s.cls}). Needs <b>${s.s}</b> subnets and <b>${s.h}</b> usable hosts per subnet. Find the custom mask, subnets, hosts and bits borrowed.</p><p class="sub">Subnets: smallest 2<sup>n</sup> ≥ needed. Hosts: 2<sup>h</sup> − 2 ≥ needed.</p>${s.show?`<div class="why">Default mask <code>${s.cls=="C"?"255.255.255.0":"255.255.0.0"}</code><br>Bits borrowed: <b>${s.sb}</b><br>Custom mask: <code>${maskStr(s.p)}</code> (/${s.p})<br>Total subnets: ${2**s.sb}<br>Host addresses per subnet: ${2**s.hbits}<br>Usable per subnet: ${2**s.hbits-2}</div>`:`<button class="btn pri" onclick="spShow()">Show answer</button>`} <button class="btn" onclick="newSP();render()">New one</button></div>`}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function newClass(){const r=[[1,126,"A"],[128,191,"B"],[192,223,"C"],[224,239,"D"],[240,254,"E"]][rnd(5)];S.d.cls={ip:(r[0]+rnd(r[1]-r[0]+1))+"."+rnd(256)+"."+rnd(256)+"."+(1+rnd(254)),a:r[2],ans:null}}
function cls(k){if(S.d.cls.ans)return;S.d.cls.ans=k;render()}
function hex4(){return rnd(65536).toString(16).toUpperCase().padStart(4,"0")}
function newV6(){const b=[hex4(),hex4(),hex4(),hex4(),hex4(),hex4(),hex4(),hex4()];const s=rnd(5),l=2+rnd(3);for(let i=s;i<Math.min(8,s+l);i++)b[i]="0000";if(s+l<8&&Math.random()<.5)b[7]="00"+(rnd(250)+1).toString(16).toUpperCase().padStart(2,"0");S.d.v6={full:b.join(":"),b,show:false}}
function shorten(b){const z=b.map(x=>x.replace(/^0+(?=.)/,""));let bs=-1,bl=0;for(let i=0;i<8;){if(z[i]==="0"){let j=i;while(j<8&&z[j]==="0")j++;if(j-i>bl&&j-i>=2){bs=i;bl=j-i}i=j}else i++}if(bs<0)return z.join(":");const L=z.slice(0,bs).join(":"),R=z.slice(bs+bl).join(":");return L+"::"+R}
function v6show(){S.d.v6.show=true;render()}

else if(S.t==="quiz"){if(!S.ord.length)reset();
 if(S.done){const p=Math.round(S.sc/S.ord.length*100);h=`<div class="card"><h3>Score: ${S.sc}/${S.ord.length} (${p}%)</h3><p>${p>=80?"Strong. Move to the written questions.":p>=60?"Getting there. Re-read the notes for the ones you missed and retry.":"Go back through the notes, then retry. Repetition works."}</p><button class="btn pri" onclick="reset();render()">Try again</button></div>`}
 else{const Q=C.quiz[S.ord[S.qi]];h=`<div class="bar"><i style="width:${S.qi/S.ord.length*100}%"></i></div><div class="card"><p><b>Question ${S.qi+1} of ${S.ord.length}</b></p><p>${Q.t}</p>${Q.o.map((o,i)=>`<button class="opt ${S.ans!==null?(i===Q.a?"ok":i===S.ans?"bad":""):""}" onclick="pick(${i})">${o}</button>`).join("")}${S.ans!==null?`<div class="why">${S.ans===Q.a?"Correct. ":"Not quite. "}${Q.w}</div><button class="btn pri" onclick="next()">${S.qi+1>=S.ord.length?"See score":"Next"}</button>`:""}</div>`}}
else if(S.t==="written")h=`<p class="sub">Write your own answer first, then open the model answer. This is how you practice for structured questions.</p>`+C.written.map(w=>`<details><summary>${w[0]}</summary><p>${w[1]}</p></details>`).join("");
else{if(!S.d.cls)newClass();if(!S.d.v6)newV6();const c=S.d.cls,v=S.d.v6;
 h=`<div class="card"><h3>Drill 1: Which class?</h3><div class="big">${c.ip}</div><div class="row">${"ABCDE".split("").map(k=>`<button class="opt ${c.ans?(k===c.a?"ok":k===c.ans?"bad":""):""}" onclick="cls('${k}')">${k}</button>`).join("")}</div>${c.ans?`<div class="why">${c.ans===c.a?"Correct":"Answer: Class "+c.a}. First octet ${c.ip.split(".")[0]}. A 1–126, B 128–191, C 192–223, D 224–239, E 240–254.</div>`:""}<button class="btn" onclick="newClass();render()">New one</button></div>
 <div class="card"><h3>Drill 2: Shorten this IPv6 address</h3><div class="big">${v.full}</div><p class="sub">Drop leading zeros, then replace one run of all-zero blocks with ::</p>${v.show?`<div class="why"><code>${shorten(v.b)}</code></div>`:`<button class="btn pri" onclick="v6show()">Show answer</button>`} <button class="btn" onclick="newV6();render()">New one</button></div>
 ${subCards()}`}
$("v").innerHTML=h;if(S.t==="drill")sub()}
render();
</script></body></html>
